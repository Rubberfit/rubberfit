# engine/Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/rema-geom",
    "crates/rema-layout",
    "crates/pack-cli",
    # S3 — Rust backend service (spec: docs/superpowers/specs/
    # 2026-04-19-s3-rust-backend-design.md). Split into four layers
    # per Clean Architecture — domain owns the types, application
    # defines the Ports, supabase is the infrastructure adapter, api
    # wires Axum + middleware + OpenAPI on top.
    "crates/rema-domain",
    "crates/rema-application",
    "crates/rema-supabase",
    "crates/rema-api",
]

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# jagua-rs 0.7.1 has an over-aggressive internal debug_assert at
# `collision_detection/quadtree/qt_hazard.rs:111` — asserts that a
# `Partial` hazard spanning multiple quadrants must produce at least
# one child quadrant with colliding edges. Fires when a hazard
# polygon fully SURROUNDS a child quadrant with zero edge crossings
# (common in clearance-inflated tight-bin fixtures where rect edges
# lie outside deeper child quadrants the rect interior fully covers).
#
# Downstream neighbor-inference at qt_hazard.rs:116-163 already handles
# the zero-edge-colliding case correctly via centroid containment.
# The assertion at line 111 is over-restrictive.
#
# Release builds strip debug_asserts — production unaffected. The test
# override is the only current fix until upstream ships a patch.
#
# Upstream issue draft: `.claude/research/task9.5/jagua-upstream-issue.md`
# Root-cause analysis: `.claude/research/archive/task9.5/gemini-report.md`
[profile.test.package.jagua-rs]
debug-assertions = false
