# engine/Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/rema-geom",
    "crates/rema-layout",
    "crates/pack-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# jagua-rs 0.7.1 has an internal debug_assert at
# `collision_detection/quadtree/qt_hazard.rs:111` requiring at least one
# child quadrant to produce colliding edges when a partial hazard spans
# subdivisions. Our clearance-inflated tight-bin fixtures can produce
# grid-aligned rectangles whose edges fall exactly on quadtree
# subdivision boundaries — `Rect::collides_with(&Edge)` uses strict `>`
# there, so both neighbours miss the edge.
#
# Release builds strip debug_asserts so production is unaffected.
# Independent of Task 8's replay bug (which Task 9 fixed); reproduces
# even with the replay fix in place. Task 9 follow-up:
# `.claude/research/task9/followups.md` — upstream jagua patch candidate.
[profile.test.package.jagua-rs]
debug-assertions = false
