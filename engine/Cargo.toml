# engine/Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/rema-geom",
    "crates/rema-layout",
]

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
