# engine/Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/rf-geom",
    "crates/rf-layout",
    "crates/pack-cli",
    # S3 — Rust backend service (spec: docs/superpowers/specs/
    # 2026-04-19-s3-rust-backend-design.md). Split into four layers
    # per Clean Architecture — domain owns the types, application
    # defines the Ports, supabase is the infrastructure adapter, api
    # wires Axum + middleware + OpenAPI on top.
    "crates/rf-domain",
    "crates/rf-application",
    "crates/rf-supabase",
    "crates/rf-api",
]

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
# S3 backend stack (spec: docs/superpowers/specs/2026-04-19-s3-rust-backend-design.md).
# Versions pinned at workspace level so all backend crates move in lockstep.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "util", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# jsonwebtoken 10 dropped automatic CryptoProvider detection — without
# an explicit feature flag every verification panics at runtime with
# "Could not automatically determine the process-level CryptoProvider".
# `rust_crypto` picks the pure-Rust provider (no aws-lc-sys C bindings),
# matching the rustls-tls feature on reqwest above.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
# OpenAPI spec generation. `axum_extras` unlocks query/path extractor
# support in the `#[utoipa::path]` macros; otherwise the macros can't
# see Axum's `Path`/`Query`/`State` types.
utoipa = { version = "5", features = ["axum_extras"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# jagua-rs 0.7.1 has two over-aggressive internal debug_asserts that
# fire on legitimate inputs:
#
# 1. `collision_detection/quadtree/qt_hazard.rs:111` — asserts that a
#    `Partial` hazard spanning multiple quadrants must produce at least
#    one child quadrant with colliding edges. Fires when a hazard
#    polygon fully SURROUNDS a child quadrant with zero edge crossings
#    (common in clearance-inflated tight-bin fixtures where rect edges
#    lie outside deeper child quadrants the rect interior fully covers).
#    Downstream neighbor-inference at qt_hazard.rs:116-163 already handles
#    the zero-edge-colliding case correctly via centroid containment.
#
# 2. `probs/bpp/util/assertions.rs:11` — `assert_eq!(bpp.density(),
#    sol.density(...))` panics with `NaN != NaN` when LBF places zero
#    items (both sides compute `0/0`). Surfaces when the wall-flush
#    bin expansion shrinks an item's valid centroid region small enough
#    that LBF's probabilistic sampler can't find any position. Without
#    this override, the AutoNest "Rect warm-start" toggle being
#    unchecked on a near-bin-size rectangle fixture (R6) crashes the
#    runtime.
#
# Release builds strip debug_asserts — production unaffected. The
# overrides are the only current fix until upstream ships patches.
#
# Upstream issue draft: `.claude/research/task9.5/jagua-upstream-issue.md`
# Root-cause analysis: `.claude/research/archive/task9.5/gemini-report.md`
[profile.test.package.jagua-rs]
debug-assertions = false

[profile.dev.package.jagua-rs]
debug-assertions = false
