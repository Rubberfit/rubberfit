[package]
name = "rf-application"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application ports + use cases for RF backend (S3)"

[dependencies]
rf-domain = { path = "../rf-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
# Use-case-layer logging for best-effort side effects (e.g.
# notification on PO-approved that we deliberately don't let fail
# the primary transaction). The actual subscriber is installed by
# the rf-api binary; rf-application only emits events.
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
