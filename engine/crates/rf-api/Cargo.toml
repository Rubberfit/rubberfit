[package]
name = "rf-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axum HTTP API for RF backend (S3)"

[[bin]]
name = "rf-api"
path = "src/main.rs"

# CI helper: `cargo run --bin dump-openapi > engine/crates/rf-api/openapi.json`
# regenerates the committed spec. Kept as a bin (not a test) so it's
# trivial to invoke from build scripts and pipelines.
[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[dependencies]
rf-domain = { path = "../rf-domain" }
rf-application = { path = "../rf-application" }
rf-supabase = { path = "../rf-supabase" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
utoipa = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
async-trait = "0.1"
base64 = "0.22"
