name: Security Audit

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  push:
    paths:
      - "/package.json"
      - "/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: /package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit and check for critical vulnerabilities
        run: |
          STDERR_FILE=$(mktemp)
          trap 'rm -f "$STDERR_FILE"' EXIT

          RESULT=$(npm audit --audit-level=critical --json 2>"$STDERR_FILE" || true)

          if [ -z "$RESULT" ] || ! echo "$RESULT" | jq -e . >/dev/null 2>&1; then
            echo "::error::npm audit did not return valid JSON output"
            if [ -s "$STDERR_FILE" ]; then
              cat "$STDERR_FILE" >&2
            fi
            exit 1
          fi

          CRITICAL=$(echo "$RESULT" | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo "$RESULT" | jq '.metadata.vulnerabilities.high // 0')
          echo "npm audit summary: Critical: $CRITICAL, High: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical vulnerabilities"
            exit 1
          fi
