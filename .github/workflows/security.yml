name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 8am UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Check for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Audit summary
        if: always()
        run: |
          echo "## Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  security-hardcoded-check:
    name: Hardcoded Credentials Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for potential hardcoded secrets..."
          found=0

          # Check for hardcoded Supabase keys
          if grep -rn 'sbp_[a-zA-Z0-9]' --include='*.ts' --include='*.tsx' --include='*.js' app/src/ ; then
            echo "::error::Found hardcoded Supabase access token in source code"
            found=1
          fi

          # Check for hardcoded JWT tokens
          if grep -rn 'eyJhbGciOi' --include='*.ts' --include='*.tsx' --include='*.js' app/src/ ; then
            echo "::error::Found hardcoded JWT token in source code"
            found=1
          fi

          # Check for hardcoded API keys in non-env files
          if grep -rn 'SUPABASE_ANON_KEY.*=.*ey' --include='*.ts' --include='*.tsx' --include='*.js' app/src/ ; then
            echo "::error::Found hardcoded Supabase anon key in source code"
            found=1
          fi

          # Check for private keys
          if grep -rn 'PRIVATE KEY' --include='*.ts' --include='*.tsx' --include='*.js' app/src/ ; then
            echo "::error::Found private key in source code"
            found=1
          fi

          # Check for .env files being committed
          if git ls-files '*.env' '*.env.local' '*.env.production' | grep -q . ; then
            echo "::error::Environment file committed to repository"
            found=1
          fi

          if [ "$found" -eq 0 ]; then
            echo "No hardcoded credentials found."
          else
            exit 1
          fi
