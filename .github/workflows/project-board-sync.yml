name: Project Board Sync

on:
  create:
  # Issue close events sync the project board to the Done column.
  # New-issue triggers are intentionally not wired here — issue
  # triage runs out-of-band.
  issues:
    types: [closed]
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        edited,
        review_requested,
        review_request_removed,
        closed,
      ]
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log actions without mutating the project
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  sync:
    if: >
      (github.event_name != 'create' || github.event.ref_type == 'branch') &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync project board
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_OWNER: Arc-and-Anchor
          PROJECT_NUMBER: 9
          PROJECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
        run: node .github/scripts/project-board-sync.mjs
